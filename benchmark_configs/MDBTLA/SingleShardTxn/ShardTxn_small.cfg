\* Smaller benchmark model for vendor/MDBTLA/SingleShardTxn/ShardTxn.tla.
\* Keeps the same invariant/property/symmetry shape as the upstream config,
\* but reduces the state space enough for routine ReleaseFast comparison.
SPECIFICATION
    Spec

CONSTANT
    RC = "linearizable"
    WC = "majority"
    Keys = {k1, k2}
    Values = {t1, t2}
    NoValue = NoValue
    STMTS = 2

INVARIANT
    TypeOK
    BaitLog
    SnapshotIsolation

PROPERTIES
    Termination

SYMMETRY
    TxIdSymmetric
