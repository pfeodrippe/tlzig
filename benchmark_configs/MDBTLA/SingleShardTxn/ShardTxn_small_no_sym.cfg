    RC = "linearizable"
    WC = "majority"
    Keys = {k1, k2}
    Values = {t1, t2}
    NoValue = NoValue
    STMTS = 2

INVARIANT
    TypeOK
    BaitLog
    SnapshotIsolation

PROPERTIES
    Termination

