\* Smaller benchmark model for vendor/MDBTLA/SingleShardTxn/ShardTxn.tla.
\* Safety-only variant. Keeps symmetry and invariants but disables liveness,
\* allowing the benchmark to distinguish temporal checking from reachability.
SPECIFICATION
    Spec

CONSTANT
    RC = "linearizable"
    WC = "majority"
    Keys = {k1, k2}
    Values = {t1, t2}
    NoValue = NoValue
    STMTS = 2

INVARIANT
    TypeOK
    BaitLog
    SnapshotIsolation

SYMMETRY
    TxIdSymmetric

